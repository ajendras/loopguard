<svg xmlns="http://www.w3.org/2000/svg" width="900" height="442" viewBox="0 0 900 442" role="img" aria-label="LoopGuard — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="442" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="442" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">LoopGuard — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#f472b6">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 0.50s steps(11) 0.60s forwards" fill="#e5e7eb">npm install</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.40s forwards" fill="#94a3b8">added 284 packages in 8s</text>
<text x="50" y="126" class="l" style="animation:show .01s 1.62s forwards" fill="#94a3b8">prepared devDependencies in 2s</text>
<text x="28" y="178" class="l" style="animation:show .01s 2.19s forwards"><tspan fill="#f472b6">❯</tspan></text><text x="50" y="178" class="l ty" style="animation:show .01s 2.19s forwards,type 0.50s steps(11) 2.19s forwards" fill="#e5e7eb">npm run dev</text>
<text x="50" y="204" class="l" style="animation:show .01s 2.99s forwards" fill="#4ade80">✓ Ready on http://localhost:3000</text>
<text x="50" y="230" class="l" style="animation:show .01s 3.21s forwards" fill="#94a3b8">Socket server listening on :4001</text>
<text x="28" y="282" class="l" style="animation:show .01s 3.78s forwards"><tspan fill="#f472b6">❯</tspan></text><text x="50" y="282" class="l ty" style="animation:show .01s 3.78s forwards,type 1.40s steps(31) 3.78s forwards" fill="#e5e7eb">node examples/shopping-agent.js</text>
<text x="50" y="308" class="l" style="animation:show .01s 5.48s forwards" fill="#94a3b8">Connected to LoopGuard</text>
<text x="50" y="334" class="l" style="animation:show .01s 5.70s forwards" fill="#94a3b8">Proposed: POST https://checkout.example.com/pay with CC details</text>
<text x="50" y="360" class="l" style="animation:show .01s 5.92s forwards" fill="#94a3b8">Waiting for human approval...</text>
<g class="l" style="animation:show .01s 6.49s forwards"><text x="28" y="412" fill="#f472b6">❯</text><rect class="cur" x="50" y="397" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
