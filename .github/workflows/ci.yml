name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: if [ -f package.json ]; then npm install --no-audit --no-fund; fi
      - name: Test
        run: if [ -f package.json ]; then npm test --if-present; fi
